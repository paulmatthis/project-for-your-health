StylesPath = .vale/styles
MinAlertLevel = suggestion

Packages = Google

[*.md]
BasedOnStyles = Google, Local

# Noise for this project: headers are ALL-CAPS section titles ("TONE",
# "CORE RULE"), not real acronyms, and CLAUDE.md deliberately writes out
# "do not" in places. The em-dash ban is enforced by Local.NoEmDash
# instead of Google.EmDash, which only catches dashes with spaces around
# them.
Google.Acronyms = NO
Google.Contractions = NO
Google.EmDash = NO

# AMPM.yml wants "5 AM" for any clock time, but this project consistently
# writes times as "5am" (matching effective_date.py's own DAY_START_HOUR
# framing) and "midnight" - a deliberate style choice, not a missed space.
Google.AMPM = NO

# Colons.yml flags anything after a colon that isn't lowercase, but this
# project uses colons to introduce defined terms it deliberately keeps
# capitalized: spending categories (Groceries, Alcohol/Beer), workbook tab
# names (Daily Summary), and literal hook output/format strings (PRIMARY
# DEVICE, PRIMARY_DEVICE_SIGNATURE:). Checked every hit across the project
# before disabling this, all of them were this same false positive.
Google.Colons = NO

# OxfordComma.yml pattern-matches on a comma followed later by "or"/"and"
# without actually parsing list structure, so it false-positives on two
# things common in this project's writing: tight bullet lists with no
# blank line between items (it reads consecutive bullets as one run-on
# sentence), and genuine two-item "X, not Y or Z" constructions that were
# never a three-item series needing a serial comma. Checked every hit
# before disabling, all of them were one of these two cases, not a real
# missing comma.
Google.OxfordComma = NO

# Parens.yml flags every single parenthetical, but this project uses them
# consistently for load-bearing asides (a caveat, an example, a cross
# reference) that would read worse as a separate sentence or a filler
# transition, which the project's own TONE section explicitly avoids.
# Checked the full spread across every file: no stacked/nested parens
# anywhere, just normal, isolated asides. Already the reasoning behind
# profile-and-targets.md's exemption below; promoted here since it holds
# project-wide.
Google.Parens = NO

# Both real hits were negations, not actual overclaiming: "best-guess" is
# an idiom for "closest approximation," and "not a guarantee" is a
# deliberate hedge against overclaiming, the opposite of what this rule
# looks for.
Google.ExcessiveClaims = NO

# These are data logs (tables of amounts, items, dates), not prose.
# Google's style rules (passive voice, contractions, etc.) are noise here,
# but the em-dash ban is a hard content rule, not a prose-style rule, so
# Local stays on even though Google drops out.
[food-log.md]
BasedOnStyles = Local

[spending-log.md]
BasedOnStyles = Local

[grocery-purchases.md]
BasedOnStyles = Local

[exercise-log.md]
BasedOnStyles = Local

# These are raw source-data transcriptions (a bank statement's own line
# items, dates, and formatting), not prose Claude wrote, so Google's prose
# rules (date format, passive voice, and so on) don't apply. The em-dash
# ban still does, for the explanatory note at the top of the file, which
# is Claude's own prose. Path is statements/, matching CLAUDE.md's FILES
# section (this pattern didn't get updated when that folder was added,
# and silently stopped matching until this fix).
[statements/*.md]
BasedOnStyles = Local

# Google.Units misreads "20s" and "50s" (decades, from the Pontzer et al.
# citation) as a number needing a nonbreaking space before a unit, which
# they aren't.
[profile-and-targets.md]
Google.Units = NO

# The message Claude sends the person at the end of onboarding (see CLAUDE.md's
# FIRST RUN / ONBOARDING closing step). It's deliberately a first-person,
# casually upbeat chat message, not third-person documentation, so
# Google.FirstPerson's "avoid I/me/my" and Google.Exclamation's "no !"
# guidance don't apply here. Same "20s/50s" Google.Units false positive
# as profile-and-targets.md, from the same citation.
[welcome-message.md]
Google.FirstPerson = NO
Google.Exclamation = NO
Google.Units = NO
